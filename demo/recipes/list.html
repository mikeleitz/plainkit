<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>List · plainkit</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
</head>
<body class="pk-page">
  <div class="pk-shell">
    <header class="pk-header">
      <div class="pk-header-start">
        <div class="pk-mark" aria-hidden="true">pk</div>
        <div>
          <p class="pk-sub">Account</p>
          <h1>List</h1>
        </div>
      </div>
      <nav class="pk-nav" aria-label="Demo">
        <a href="../">Recipes</a>
      </nav>
    </header>

    <nav aria-label="Breadcrumb">
      <ol class="pk-crumb">
        <li><a href="../">Recipes</a></li>
        <li><span aria-current="page">List</span></li>
      </ol>
    </nav>

    <section class="pk-card pk-stack">
      <form method="get" class="pk-stack">
        <label class="pk-field">
          <span class="pk-field-label">Search</span>
          <input class="pk-input" name="q" type="search" value="" autocomplete="off">
        </label>
        <div class="pk-form-actions">
          <button type="submit" class="pk-btn pk-btn-cta">Search</button>
        </div>
      </form>
    </section>

    <section class="pk-card pk-empty" id="empty" hidden>
      <h2 id="empty-title">No items match</h2>
      <p id="empty-copy">Try a different search.</p>
    </section>

    <section class="pk-card" id="list-card" hidden>
      <div class="pk-toolbar">
        <h2 class="pk-card-title">Items</h2>
      </div>
      <div class="pk-list" id="item-list"></div>
      <nav aria-label="Pages">
        <ol class="pk-pager" id="pager" hidden></ol>
      </nav>
    </section>
  </div>

  <template id="tpl-item">
    <div class="pk-list-row">
      <span>
        <span class="pk-list-title"></span>
        <span class="pk-list-meta"></span>
      </span>
      <span class="pk-pill"></span>
    </div>
  </template>
  <template id="tpl-page">
    <li><a href=""></a></li>
  </template>
  <script type="module" src="./list.js"></script>
</body>
</html>
